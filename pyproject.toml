[project]
name = "neuralnet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorlog==6.10.1",
    "efficient-kan",
    "hgq2==0.2.0",
    "jupyterlab>=4.6.4",
    "matplotlib==3.10.8",
    "mplhep==1.1.2",
    "pandas==3.0.0",
    "pandera==0.30.1",
    "pennylane==0.45.0",
    "polars==1.39.3",
    "pyarrow==23.0.0",
    "pydantic==2.12.5",
    "python-dotenv>=1.2.4",
    "pyyaml==6.0.3",
    "scikit-learn==1.8.0",
    "submitit==1.5.4",
    "tensorflow==2.20.0",
    "torch==2.11.0",
    "typer==0.23.1",
]

[project.scripts]
neuralnet = "neuralnet.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -vv"
# log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s | %(levelname)s | %(name)s | %(module)s | %(funcName)s | %(lineno)s | %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
pythonpath = "src/"

[tool.pytest_env]
env_files = [".env"]

[tool.ruff]
fix = true
line-length = 120
# lint.select = 
lint.ignore = ["I001", "SIM117"]
exclude = [".venv", "tests/"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.uv.sources]
efficient-kan = { git = "https://github.com/Blealtan/efficient-kan.git", rev = "7b6ce1c87f18c8bc90c208f6b494042344216b11" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
